name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: personalwebsite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Vercel deploys main automatically via its Git integration.
  # This job waits for that deployment and reports its result here.
  vercel:
    name: Vercel deploy
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Wait for Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 90); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA" \
              --jq '[.[] | select(.environment | test("^production$"; "i"))][0].id // empty')
            if [ -z "$id" ]; then
              echo "[$i] Waiting for Vercel to start the deployment..."
            else
              state=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // "pending"')
              url=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].environment_url // ""')
              echo "[$i] Vercel deployment $id: $state"
              case "$state" in
                success)
                  echo "Deployed: $url"
                  echo "### Deployed to Vercel: $url" >> "$GITHUB_STEP_SUMMARY"
                  exit 0 ;;
                failure|error)
                  echo "::error::Vercel deployment failed"
                  exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Vercel deployment"
          exit 1
